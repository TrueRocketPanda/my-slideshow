<!DOCTYPE html>
<html>
<head>
<title>Region-Specific Slideshow</title>
<style>
.slideshow-container {
  max-width: 800px;
  position: relative;
  margin: auto;
}

.mySlides {
  display: none;
  position: relative; /* Needed for absolute positioning of regions */
  overflow: hidden;  /* Hide parts of the image outside the region */
}

.mySlides img {
  width: 100%;
  height: auto;
  display: block;
  max-height: 500px;
    margin: 0 auto;
    object-fit: contain;
}

.prev, .next {
  cursor: pointer;
  position: absolute;
  top: 50%;
  width: auto;
  margin-top: -22px;
  padding: 16px;
  color: white;
  font-weight: bold;
  font-size: 20px;
  transition: 0.6s ease;
  border-radius: 0 3px 3px 0;
  user-select: none;
  background-color: rgba(0, 0, 0, 0.5);
}

.next {
  right: 0;
  border-radius: 3px 0 0 3px;
}

.prev:hover, .next:hover {
  background-color: rgba(0, 0, 0, 0.8);
}

.text {
  color: #f2f2f2;
  font-size: 15px;
  padding: 8px 12px;
  position: absolute;
  bottom: 8px;
  width: 100%;
  text-align: center;
  background-color: rgba(0, 0, 0, 0.5);
}

.numbertext {
  color: #f2f2f2;
  font-size: 12px;
  padding: 8px 12px;
  position: absolute;
  top: 0;
}
.dot-container {
    text-align: center;
    padding: 20px;
    background: #ddd;
}
.dot {
  cursor: pointer;
  height: 15px;
  width: 15px;
  margin: 0 2px;
  background-color: #bbb;
  border-radius: 50%;
  display: inline-block;
  transition: background-color 0.6s ease;
}

.active, .dot:hover {
  background-color: #717171;
}

.fade {
  animation-name: fade;
  animation-duration: 1.5s;
}

@keyframes fade {
  from {opacity: .4}
  to {opacity: 1}
}

/* Region Styling */
.region {
    position: absolute; /* Absolute positioning within the slide */
    /* Initially hide all regions.  Display will be controlled by JavaScript */
    display: none;
}


</style>
</head>
<body>

<h2>Region-Specific Photo Slideshow</h2>

<div class="slideshow-container">

    <div class="mySlides fade">
        <div class="numbertext">1 / 3</div>
        <img src="image1.jpg" alt="Image 1">
        <div class="text">Caption Text 1</div>
    </div>

    <div class="mySlides fade">
        <div class="numbertext">2 / 3</div>
        <img src="image2.jpg" alt="Image 2">
        <div class="text">Caption Two</div>
    </div>

    <div class="mySlides fade">
        <div class="numbertext">3 / 3</div>
        <img src="image3.jpg" alt="Image 3">
        <div class="text">Caption Three</div>
    </div>

    <a class="prev" onclick="plusSlides(-1)">&#10094;</a>
    <a class="next" onclick="plusSlides(1)">&#10095;</a>
</div>
<br>
<div class="dot-container">
    <span class="dot" onclick="currentSlide(1)"></span>
    <span class="dot" onclick="currentSlide(2)"></span>
    <span class="dot" onclick="currentSlide(3)"></span>
</div>
<script>
    let slideIndex = 1;

    // Image region data (you'll need to define this for each image and region)
    const imageData = {
      "image1.jpg": [  // Regions for image1.jpg
        { width: 200, height: 150, top: 50, left: 100, caption: "Region 1-1" },
        { width: 300, height: 200, top: 100, left: 400, caption: "Region 1-2" },
        { width: 150, height: 100, top: 250, left: 200, caption: "Region 1-3" },
      ],
      "image2.jpg": [  // Regions for image2.jpg
        { width: 250, height: 180, top: 80, left: 50, caption: "Region 2-1" },
        { width: 180, height: 120, top: 150, left: 350, caption: "Region 2-2" },
      ],
      "image3.jpg": [  // Regions for image3.jpg
        { width: 300, height: 250, top: 20, left: 150, caption: "Region 3-1" },
      ]
    };

    // Function to get URL parameters
    function getParameterByName(name, url = window.location.href) {
        name = name.replace(/[\[\]]/g, '\\$&');
        const regex = new RegExp('[?&]' + name + '(=([^&#]*)|&|#|$)');
        const results = regex.exec(url);
        if (!results) return null;
        if (!results[2]) return '';
        return decodeURIComponent(results[2].replace(/\+/g, ' '));
    }

    function showSlides(n) {
        let i;
        let slides = document.getElementsByClassName("mySlides");
        let dots = document.getElementsByClassName("dot");

        if (n > slides.length) { slideIndex = 1; }
        if (n < 1) { slideIndex = slides.length; }

        for (i = 0; i < slides.length; i++) {
            slides[i].style.display = "none";
        }
        for (i = 0; i < dots.length; i++) {
            dots[i].className = dots[i].className.replace(" active", "");
        }

        slides[slideIndex - 1].style.display = "block";
        dots[slideIndex - 1].className += " active";

        // Get the current image source
        const currentImageSrc = slides[slideIndex - 1].querySelector("img").getAttribute("src");

        // Get the region number from the URL parameter
        const regionNo = parseInt(getParameterByName("region"));
        showRegion(currentImageSrc, regionNo); // Pass image source to showRegion
    }
    function showRegion(imageSrc, regionNo) {

        const currentSlide = document.getElementsByClassName("mySlides")[slideIndex - 1];
		//remove previous regions
		const oldRegions = currentSlide.querySelectorAll(".region");
		oldRegions.forEach(region => region.remove());

        if (imageData.hasOwnProperty(imageSrc) && !isNaN(regionNo) && regionNo > 0 && regionNo <= imageData[imageSrc].length) {
            const regionData = imageData[imageSrc][regionNo - 1]; // Adjust for 0-based index
            const regionDiv = document.createElement("div");

            regionDiv.className = "region";
            regionDiv.style.width = regionData.width + "px";
            regionDiv.style.height = regionData.height + "px";
            regionDiv.style.top = regionData.top + "px";
            regionDiv.style.left = regionData.left + "px";
            regionDiv.style.display = "block"; // Make the region visible

			 // Create a new image element for the region
            const regionImage = document.createElement("img");
            regionImage.src = imageSrc;
            regionImage.style.width = (currentSlide.querySelector('img').naturalWidth) + 'px';  //Use natural width and height of full image
            regionImage.style.height = (currentSlide.querySelector('img').naturalHeight) + 'px';
            regionImage.style.position = 'absolute';
            regionImage.style.top = `-${regionData.top}px`; //Shift image up
			regionImage.style.left = `-${regionData.left}px`; // Shift image left
            regionDiv.appendChild(regionImage);


            // Create a caption element for the region (optional)
            const regionCaption = document.createElement("div");
            regionCaption.className = "text";
            regionCaption.textContent = regionData.caption;
            regionDiv.appendChild(regionCaption);

            currentSlide.appendChild(regionDiv);
             // Set the overall slide dimensions to match the region (for correct next/prev button placement)
            currentSlide.style.width = regionData.width + "px";
            currentSlide.style.height = regionData.height + "px";


        } else { //region number is not provided, or invalid, or image data not found
            //reset styles, if region number is invalid
			currentSlide.style.width = "";
            currentSlide.style.height = "";

        }
    }



    function plusSlides(n) {
        slideIndex += n;
        let regionNo = parseInt(getParameterByName("region"));
        // Preserve the region number if it exists
        if (!isNaN(regionNo)) {
           const nextSlide = slideIndex + 1 > document.getElementsByClassName("mySlides").length? 1 :  (slideIndex + 1 < 1? document.getElementsByClassName("mySlides").length: slideIndex + 1)
           const currentImageSrc = document.getElementsByClassName("mySlides")[nextSlide - 1].querySelector("img").getAttribute("src");

           if(imageData.hasOwnProperty(currentImageSrc) && regionNo <= imageData[currentImageSrc].length){
                let nextUrl =  window.location.href.split('?')[0] + `?region=${regionNo}`;
                window.history.replaceState({}, '', nextUrl); //updates url without reloading
           } else {
               //clear url parameter if current image does not have region number
                let nextUrl =  window.location.href.split('?')[0];
                window.history.replaceState({}, '', nextUrl);
           }

        }
        showSlides(slideIndex);
    }


    function currentSlide(n) {
        slideIndex = n;
        let regionNo = parseInt(getParameterByName("region"));

        // Preserve the region number parameter
        if (!isNaN(regionNo)) {
             const currentImageSrc = document.getElementsByClassName("mySlides")[slideIndex - 1].querySelector("img").getAttribute("src");

           if(imageData.hasOwnProperty(currentImageSrc) && regionNo <= imageData[currentImageSrc].length){
                let nextUrl =  window.location.href.split('?')[0] + `?region=${regionNo}`;
                window.history.replaceState({}, '', nextUrl);  //updates url without reloading
           } else {
                let nextUrl =  window.location.href.split('?')[0]
                window.history.replaceState({}, '', nextUrl);
           }

        }
        showSlides(slideIndex);
    }

    // Initial setup
    showSlides(slideIndex);

</script>

</body>
</html>
